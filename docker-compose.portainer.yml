version: "3.8"

services:
  watermeter:
    image: ghcr.io/ip0p/watermeter:latest
    container_name: watermeter
    ports:
      - "5000:5000"
    volumes:
      - ${WATERMETER_DATA_DIR:-/opt/watermeter-data}:/data
    environment:
      - ALLOW_PRIVATE_URLS=${ALLOW_PRIVATE_URLS:-true}
    restart: unless-stopped
